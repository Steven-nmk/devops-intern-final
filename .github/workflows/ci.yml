name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
      - name: Run ShellCheck
        uses: koalaman/shellcheck-action@v0.3.1
        with:
          scandir: './scripts'
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Build Docker Image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./app
          load: true
          tags: nginx-app:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
      - name: Export image for testing
        run: docker save nginx-app:${{ github.sha }} > /tmp/nginx-app.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: docker-image
          path: /tmp/nginx-app.tar

  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
      - name: Download image artifact
        uses: actions/download-artifact@v4.1.2
        with:
          name: docker-image
          path: /tmp
      - name: Load Docker image
        run: docker load < /tmp/nginx-app.tar
      - name: Start Container
        run: |
          docker run -d -p 8080:8080 --name test-app nginx-app:${{ github.sha }}
      - name: Wait for readiness
        run: sleep 5
      - name: Run Healthcheck Script
        run: |
          chmod +x ./scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080/healthz

  publish:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Build and push Docker image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
